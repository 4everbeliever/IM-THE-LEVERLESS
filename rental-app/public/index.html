<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RentFlow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#e9eeee;--ink:#14262b;--muted:#5b6f74;--line:#c9d4d5;--card:#f8fafa;--accent:#0f5c63;--warn:#b4441c;--ok:#2f7d4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:14px 24px;background:var(--ink);color:#fff}
header h1{margin:0;font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin-right:auto}
nav button,.ghost{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:6px 2px;border-bottom:2px solid transparent}
nav button.on{border-color:#f2b134}
main{max-width:980px;margin:0 auto;padding:24px}
h2{font-size:1.6rem;margin:0 0 16px;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
.card h3{margin:0 0 4px;font-size:1.1rem}
.muted{color:var(--muted);font-size:.9rem}
.rate{font-size:1.5rem;font-weight:800;margin:8px 0}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.8rem;border:1px solid currentColor}
.available,.paid,.returned{color:var(--ok)}.rented,.checked_out,.reserved{color:var(--accent)}.maintenance{color:var(--warn)}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
button.btn.alt{background:none;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid #f2b134;outline-offset:2px}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:.9rem}
input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;font:inherit;background:#fff}
form.card{max-width:380px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td .btn{margin-right:6px;padding:4px 10px}
dialog{border:1px solid var(--line);border-radius:6px;padding:20px;width:min(360px,92vw)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:4px;display:none}
#toast.err{background:var(--warn)}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <h1>RentFlow</h1>
  <nav id="nav" class="hide">
    <button data-v="items" class="on">Equipment</button>
    <button data-v="bookings">Bookings</button>
    <button data-v="add" id="addTab" class="hide">Add equipment</button>
    <button data-v="maint" id="maintTab" class="hide">Maintenance</button>
  </nav>
  <span id="who" class="muted"></span>
  <button class="ghost hide" id="out">Log out</button>
</header>

<main>
  <section id="auth">
    <h2>Log in to book equipment</h2>
    <form class="card" id="loginForm">
      <label for="e">Email</label><input id="e" type="email" required>
      <label for="p">Password</label><input id="p" type="password" required minlength="8">
      <div id="nameFields" class="hide">
        <label for="fn">First name</label><input id="fn">
        <label for="ln">Last name</label><input id="ln">
        <label for="ph">Phone</label><input id="ph" type="tel">
        <label for="hp">Province</label><select id="hp"><option>Bohol</option></select>
        <label for="hb">Municipality</label><select id="hb"></select>
      </div>
      <p><button class="btn" id="authBtn">Log in</button>
      <button type="button" class="ghost" id="switch">Create an account</button></p>
    </form>
  </section>

  <section id="items" class="hide"><h2>Equipment</h2><div class="grid" id="itemGrid"></div></section>
  <section id="bookings" class="hide"><h2>Bookings</h2><div class="tablewrap"><table id="bkTable"></table></div></section>
  <section id="add" class="hide"><h2>Add equipment</h2>
    <form class="card" id="addForm">
      <label for="an">Name</label><input id="an" required>
      <label for="as">Serial number</label><input id="as">
      <label for="ac">Category</label><select id="ac"></select>
      <label for="ab">Branch</label><select id="ab"></select>
      <p><button class="btn">Add equipment</button></p>
    </form>
  </section>
  <section id="maint" class="hide"><h2>Maintenance</h2>
    <form class="card" id="maintForm">
      <label for="mi">Item</label><select id="mi"></select>
      <label for="md">Work done</label><input id="md" required>
      <label for="mc">Cost</label><input id="mc" type="number" min="0" step="0.01">
      <label for="mm">Item status after</label>
      <select id="mm"><option value="maintenance">Keep in maintenance</option><option value="available">Ready to rent</option></select>
      <p><button class="btn">Save log</button></p>
    </form>
    <div class="tablewrap" style="margin-top:16px"><table id="mTable"></table></div>
  </section>
</main>

<dialog id="bookDlg">
  <form method="dialog" id="bookForm">
    <h3 id="bookTitle"></h3>
    <label for="sd">Pick-up</label><input id="sd" type="datetime-local" required>
    <label for="ed">Return</label><input id="ed" type="datetime-local" required>
    <div id="svcList"></div>
    <p><button class="btn">Reserve</button> <button type="button" class="btn alt" id="cancelBook">Cancel</button></p>
  </form>
</dialog>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => d ? new Date(d).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : '—';
let session = JSON.parse(localStorage.getItem('session') || 'null');
let signup = false, bookingItem = null, services = [];

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3500);
}
async function api(path, method = 'GET', body) {
  const res = await fetch('/api' + path, {
    method, headers: {'Content-Type': 'application/json', ...(session && {Authorization: 'Bearer ' + session.token})},
    body: body && JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && session) { logout(); }
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}
const run = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };
const isStaff = () => session && ['staff', 'admin'].includes(session.user.role);

function show(view) {
  ['auth', 'items', 'bookings', 'add', 'maint'].forEach(v => $('#' + v).classList.toggle('hide', v !== view));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  if (view === 'items') loadItems(); if (view === 'bookings') loadBookings(); if (view === 'add') loadLookups(); if (view === 'maint') loadMaint();
}
function refreshChrome() {
  $('#nav').classList.toggle('hide', !session); $('#out').classList.toggle('hide', !session);
  $('#addTab').classList.toggle('hide', !isStaff()); $('#maintTab').classList.toggle('hide', !isStaff());
  $('#who').textContent = session ? `${session.user.name} (${session.user.role})` : '';
}
function logout() { session = null; localStorage.removeItem('session'); refreshChrome(); show('auth'); }

// Auth
$('#switch').onclick = () => {
  signup = !signup; $('#nameFields').classList.toggle('hide', !signup);
  $('#authBtn').textContent = signup ? 'Create account' : 'Log in';
  $('#switch').textContent = signup ? 'I have an account' : 'Create an account';
};
$('#loginForm').onsubmit = run(async e => {
  e.preventDefault();
  session = await api(signup ? '/register' : '/login', 'POST', {
    email: $('#e').value, password: $('#p').value, first_name: $('#fn').value, last_name: $('#ln').value,
    phone_number: $('#ph').value, home_branch_id: $('#hb').value });
  localStorage.setItem('session', JSON.stringify(session)); refreshChrome(); show('items');
});
$('#out').onclick = logout;
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.v));

// Equipment
const loadItems = run(async () => {
  const items = await api('/items');
  $('#itemGrid').innerHTML = items.map(i => `
    <div class="card"><h3>${esc(i.item_name)}</h3>
      <div class="muted">${esc(i.category_name)} · ${esc(i.branch_name)}</div>
      <div class="rate">$${Number(i.daily_rate).toFixed(2)} <span class="muted">/ day</span></div>
      <span class="pill ${esc(i.status)}">${esc(i.status)}</span>
      <p><button class="btn" data-id="${i.item_id}" data-name="${esc(i.item_name)}" ${i.status === 'maintenance' ? 'disabled' : ''}>Book this item</button></p>
    </div>`).join('') || '<p class="muted">No equipment yet.</p>';
  $('#itemGrid').querySelectorAll('button').forEach(b => b.onclick = () => {
    bookingItem = b.dataset.id; $('#bookTitle').textContent = 'Book ' + b.dataset.name; $('#svcList').innerHTML = services.length ? '<p class="muted">Add-ons (quantity)</p>' + services.map(s =>
      `<label>${esc(s.service_name)} · $${Number(s.price).toFixed(2)}<input type="number" min="0" value="0" data-id="${s.service_id}"></label>`).join('') : '';
    $('#bookDlg').showModal();
  });
});
$('#cancelBook').onclick = () => $('#bookDlg').close();
$('#bookForm').onsubmit = run(async e => {
  e.preventDefault();
  await api('/bookings', 'POST', { item_id: bookingItem, start_date: $('#sd').value, end_date: $('#ed').value,
    services: [...document.querySelectorAll('#svcList input')].map(i => ({ service_id: i.dataset.id, quantity: i.value })).filter(s => s.quantity > 0) });
  $('#bookDlg').close(); toast('Booking reserved'); show('bookings');
});

// Bookings
const loadBookings = run(async () => {
  const rows = await api('/bookings'), staff = isStaff();
  $('#bkTable').innerHTML = `<tr><th>#</th><th>Item</th>${staff ? '<th>Customer</th>' : ''}<th>Pick-up</th><th>Return</th><th>Status</th><th>Payment</th><th></th></tr>` +
    rows.map(b => `<tr><td>${b.booking_id}</td><td>${esc(b.item_name)}</td>${staff ? `<td>${esc(b.customer)}</td>` : ''}
      <td>${fmt(b.start_date)}</td><td>${fmt(b.end_date)}</td>
      <td><span class="pill ${esc(b.status)}">${esc(b.status.replace('_', ' '))}</span></td>
      <td>${Number(b.paid) > 0 ? `<span class="pill paid">$${Number(b.paid).toFixed(2)} paid</span>` : '<span class="muted">unpaid</span>'}</td>
      <td>${Number(b.paid) > 0 ? '' : `<button class="btn alt" data-a="pay" data-id="${b.booking_id}">Pay</button>`}
        ${staff && b.status === 'reserved' ? `<button class="btn" data-a="checkout" data-id="${b.booking_id}">Check out</button>` : ''}
        ${staff && b.status === 'checked_out' ? `<button class="btn" data-a="return" data-id="${b.booking_id}">Return</button>` : ''}</td></tr>`).join('');
  $('#bkTable').querySelectorAll('button').forEach(b => b.onclick = run(async () => {
    const id = b.dataset.id, a = b.dataset.a;
    if (a === 'pay') await api(`/bookings/${id}/pay`, 'POST', { method: 'cash' });
    if (a === 'checkout') await api(`/bookings/${id}/checkout`, 'POST', { notes: prompt('Condition notes at checkout (optional):') || '' });
    if (a === 'return') {
      const notes = prompt('Condition notes at return (optional):') || '';
      await api(`/bookings/${id}/return`, 'POST', { notes, damaged: confirm('Is the item damaged? OK = yes, send to maintenance') });
    }
    toast('Done'); loadBookings();
  }));
});

// Add equipment (staff)
const loadLookups = run(async () => {
  const { branches, categories, services: sv } = await api('/lookups'); services = sv;
  $('#hb').innerHTML = '<option value="">Choose your municipality</option>' + branches.map(b => `<option value="${b.branch_id}">${esc(b.branch_name)}</option>`).join('');
  $('#ab').innerHTML = branches.map(b => `<option value="${b.branch_id}">${esc(b.branch_name)}</option>`).join('');
  $('#ac').innerHTML = categories.map(c => `<option value="${c.category_id}">${esc(c.category_name)}</option>`).join('');
});
$('#addForm').onsubmit = run(async e => {
  e.preventDefault();
  await api('/items', 'POST', { item_name: $('#an').value, serial_number: $('#as').value, category_id: $('#ac').value, branch_id: $('#ab').value });
  e.target.reset(); toast('Equipment added');
});

// Maintenance (staff)
const loadMaint = run(async () => {
  const [items, logs] = await Promise.all([api('/items'), api('/maintenance')]);
  $('#mi').innerHTML = items.map(i => `<option value="${i.item_id}">${esc(i.item_name)} (${esc(i.status)})</option>`).join('');
  $('#mTable').innerHTML = '<tr><th>Item</th><th>Work done</th><th>Cost</th><th>By</th><th>Date</th></tr>' +
    logs.map(m => `<tr><td>${esc(m.item_name)}</td><td>${esc(m.description)}</td><td>$${Number(m.cost || 0).toFixed(2)}</td><td>${esc(m.staff)}</td><td>${fmt(m.performed_at)}</td></tr>`).join('');
});
$('#maintForm').onsubmit = run(async e => {
  e.preventDefault();
  await api('/maintenance', 'POST', { item_id: $('#mi').value, description: $('#md').value, cost: $('#mc').value || 0, mark: $('#mm').value });
  e.target.reset(); toast('Maintenance logged'); loadMaint();
});

loadLookups();
refreshChrome(); show(session ? 'items' : 'auth');
</script>
</body>
</html>
